  /* ── Terrain ── */

    if (terrain === "Mixed" || terrain === "Beach") return TERRA;
    return GOLD;

  function terrainRgba(terrain) {
    if (terrain === "Trail" || terrain === "Mountain") return "74,158,125";
    if (terrain === "Mixed" || terrain === "Beach") return "224,122,95";
    return "201,168,76";
  }

  /* ════

  /* ── Hover ── */
  function addHovers(container) {
    var cards = container.querySelectorAll(".stride-race-card, .stride-edit-card");
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener("mouseenter", function() {
        this.style.transform = "translateY(-5px) scale(1.01)";
        this.style.boxShadow = "0 20px 60px rgba(0,0,0,0.4)";
      });
      cards[i].addEventListener("mouseleave", function() {
        this.style.transform = "translateY(0) scale(1)";
        this.style.boxShadow = "none";
      });
    }
  }

  /* ════
     PAGE NAVIGATION
     ════ */
  function navigateTo(page, data) {
    currentPage = page;

    /* Update URL hash for shareable links */
    if (page === "state" && data) window.location.hash = "/state/" + data;
    else if (page === "article" && data) window.location.hash = "/article/" + data.id;
    else if (page !== "home") window.location.hash = "/" + page;
    else if (window.location.hash) history.replaceState(null, "", window.location.pathname);

    /* Hide all pages */
    var pages = document.querySelectorAll('[class*="stride-page-"]');
    for (var i = 0; i < pages.length; i++) {
      pages[i].classList.remove("active");
      pages[i].style.display = "none";
    }

    /* Show target page */
    var target = document.querySelector(".stride-page-" + page);
    if (target) {
      target.classList.add("active");
      target.style.display = "block";
    }

    /* Update nav link colors */
    var navLinks = document.querySelectorAll("[data-page]");
    for (var j = 0; j < navLinks.length; j++) {
      var lp = navLinks[j].getAttribute("data-page");
      navLinks[j].style.color = (lp === page) ? GOLD : SLATE;
    }

    window.scrollTo(0, 0);

    /* Render page content */
    if (page === "home") renderHome();
    else if (page === "state") renderState(data);
    else if (page === "editorial") renderEditorial();
    else if (page === "article") renderArticle(data);
    else if (page === "submit") renderSubmit();
    else if (page === "partner") renderPartner();
  }

  /* ════
     HOME PAGE
     ════ */
  function renderHome() {
    /* Hero gradient animation */
    var hero = document.getElementById("stride-hero");
    if (hero) {
      hero.style.background = heroGradients[heroIndex];
      hero.style.transition = "background 2s ease";
      if (heroTimer) clearInterval(heroTimer);
      heroTimer = setInterval(function() {
        heroIndex = (heroIndex + 1) % 3;
        hero.style.background = heroGradients[heroIndex];
      }, 6000);
    }

    buildMap();
    buildSearch();
    buildFeatured();
    buildEditorialHome();
    buildEmailCapture();
    buildBrands();
  }

  /* ── State Boundaries ── */
  function loadBorders(svg, ns) {
    var urls = [
      "https://upload.wikimedia.org/wikipedia/commons/1/1a/Blank_US_Map_%28states_only%29.svg",
      "https://simplemaps.com/static/svg/us/us-all.svg"
    ];
    function tryUrl(idx) {
      if (idx >= urls.length) return;
      fetch(urls[idx]).then(function(r) {
        if (!r.ok) throw new Error("fail");
        return r.text();
      }).then(function(txt) {
        var doc = new DOMParser().parseFromString(txt, "image/svg+xml");
        var srcSvg = doc.querySelector("svg");
        if (!srcSvg) return;
        var vb = (srcSvg.getAttribute("viewBox") || "").split(/[\s,]+/);
        var srcW = vb.length >= 4 ? parseFloat(vb[2]) : 960;
        var srcH = vb.length >= 4 ? parseFloat(vb[3]) : 600;
        var sc = Math.min(800 / srcW, 500 / srcH);
        var dx = (800 - srcW * sc) / 2;
        var dy = (500 - srcH * sc) / 2;
        var g = document.createElementNS(ns, "g");
        g.setAttribute("transform", "translate(" + dx + "," + dy + ") scale(" + sc + ")");
        var paths = doc.querySelectorAll("path");
        for (var i = 0; i < paths.length; i++) {
          var d = paths[i].getAttribute("d");
          if (!d) continue;
          var p = document.createElementNS(ns, "path");
          p.setAttribute("d", d);
          p.setAttribute("fill", "none");
          p.setAttribute("stroke", GOLD);
          p.setAttribute("stroke-width", String(Math.max(0.8, 1 / sc)));
          p.setAttribute("opacity", "0.3");
          g.appendChild(p);
        }
        if (g.childNodes.length > 0) svg.insertBefore(g, svg.firstChild);
      }).catch(function() { tryUrl(idx + 1); });
    }
    try { tryUrl(0); } catch(e) {}
  }

  /* ── SVG Map ── */
  function buildMap() {
    var container = document.getElementById("stride-map-container");
    if (!container) return;
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 800 500");
    svg.setAttribute("style", "width:100%;");
    loadBorders(svg, ns);

    var tooltip = document.createElement("div");
    tooltip.id = "stride-map-tooltip";
    tooltip.style.cssText = "display:none;position:absolute;top:10px;right:10px;background:"+NAVY+";border:1px solid rgba(201,168,76,0.3);border-radius:14px;padding:14px 20px;backdrop-filter:blur(16px);z-index:10;pointer-events:none;";

    var keys = Object.keys(STATES);
    for (var i = 0; i < keys.length; i++) {
      (function(code) {
        var st = STATES[code];
        var g = document.createElementNS(ns, "g");
        g.setAttribute("style", "cursor:pointer;");
        g.setAttribute("data-state", code);

        var circle = document.createElementNS(ns, "circle");
        circle.setAttribute("cx", st.x);
        circle.setAttribute("cy", st.y);
        circle.setAttribute("r", "12");
        circle.setAttribute("fill", "rgba(201,168,76,0.25)");
        circle.setAttribute("stroke", GOLD);
        circle.setAttribute("stroke-width", "0.5");
        circle.setAttribute("style", "transition:all 0.3s cubic-bezier(0.16,1,0.3,1);");

        var ring = document.createElementNS(ns, "circle");
        ring.setAttribute("cx", st.x);
        ring.setAttribute("cy", st.y);
        ring.setAttribute("r", "24");
        ring.setAttribute("fill", "none");
        ring.setAttribute("stroke", "rgba(201,168,76,0.3)");
        ring.setAttribute("stroke-width", "1");
        ring.setAttribute("style", "opacity:0;transition:opacity 0.3s;");

        var label = document.createElementNS(ns, "text");
        label.setAttribute("x", st.x);
        label.setAttribute("y", st.y + 1);
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("dominant-baseline", "middle");
        label.setAttribute("fill", CREAM);
        label.setAttribute("font-size", "7.5");
        label.setAttribute("font-weight", "700");
        label.setAttribute("font-family", "sans-serif");
        label.setAttribute("style", "transition:all 0.3s;pointer-events:none;");
        label.textContent = code;

        g.appendChild(circle);
        g.appendChild(ring);
        g.appendChild(label);

        g.addEventListener("mouseenter", function() {
          circle.setAttribute("r", "18");
          circle.setAttribute("fill", "rgba(201,168,76,0.9)");
          circle.setAttribute("stroke-width", "2");
          ring.setAttribute("style", "opacity:1;transition:opacity 0.3s;");
          label.setAttribute("fill", MIDNIGHT);
          label.setAttribute("font-size", "9");
          tooltip.style.display = "block";
          tooltip.innerHTML = '<div style="color:'+GOLD+';font-size:15px;font-weight:700;">'+esc(st.n)+'</div><div style="color:'+STONE+';font-size:12px;margin-top:3px;">'+st.r+' upcoming races</div><div style="color:rgba(201,168,76,0.6);font-size:11px;margin-top:4px;">Click to explore \u2192</div>';
        });
        g.addEventListener("mouseleave", function() {
          circle.setAttribute("r", "12");
          circle.setAttribute("fill", "rgba(201,168,76,0.25)");
          circle.setAttribute("stroke-width", "0.5");
          ring.setAttribute("style", "opacity:0;transition:opacity 0.3s;");
          label.setAttribute("fill", CREAM);
          label.setAttribute("font-size", "7.5");
          tooltip.style.display = "none";
        });
        g.addEventListener("click", function() {
          navigateTo("state", code);
        });

        svg.appendChild(g);
      })(keys[i]);
    }

    container.innerHTML = "";
    container.style.position = "relative";
    container.appendChild(svg);
    container.appendChild(tooltip);
  }

  /* ── Search ── */
  function buildSearch() {
    var input = document.getElementById("stride-search-input");
    if (!input) return;
    var bar = input.parentElement;
    var dropdown = document.getElementById("stride-search-dropdown");

    input.addEventListener("input", doSearch);
    input.addEventListener("focus", function() {
      bar.style.borderColor = "rgba(201,168,76,0.5)";
      doSearch();
    });
    input.addEventListener("blur", function() {
      setTimeout(function() {
        if (dropdown) dropdown.style.display = "none";
        bar.style.borderColor = "rgba(255,255,255,0.08)";
      }, 200);
    });

    function doSearch() {
      var val = input.value;
      var q = val.toLowerCase();
      if (!dropdown) return;
      if (val.length < 2) { dropdown.style.display = "none"; return; }

      var stateResults = [];
      var keys = Object.keys(STATES);
      for (var i = 0; i < keys.length; i++) {
        var code = keys[i];
        var st = STATES[code];
        if (st.n.toLowerCase().indexOf(q) !== -1 || code.toLowerCase() === q) {
          stateResults.push({code: code, data: st});
          if (stateResults.length >= 3) break;
        }
      }

      var raceResults = [];
      for (var j = 0; j < allRaces.length; j++) {
        var r = allRaces[j];
        if (r.name.toLowerCase().indexOf(q) !== -1 || r.city.toLowerCase().indexOf(q) !== -1 || r.type.toLowerCase().indexOf(q) !== -1) {
          raceResults.push(r);
          if (raceResults.length >= 5) break;
        }
      }

      if (stateResults.length === 0 && raceResults.length === 0) {
        dropdown.style.display = "none";
        return;
      }

      dropdown.style.display = "block";
      var html = "";

      if (stateResults.length > 0) {
        html += '<div style="padding:12px 20px 4px;"><div style="color:'+GOLD+';font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;">States</div></div>';
        for (var s = 0; s < stateResults.length; s++) {
          html += '<div class="stride-search-item" data-search-state="'+stateResults[s].code+'" style="padding:10px 20px;cursor:pointer;display:flex;justify-content:space-between;transition:background 0.15s;">'
            + '<span style="color:'+CREAM+';font-size:14px;">\u{1F4CD} '+esc(stateResults[s].data.n)+'</span>'
            + '<span style="color:'+SLATE+';font-size:12px;">'+stateResults[s].data.r+' races</span></div>';
        }
      }

      if (raceResults.length > 0) {
        html += '<div style="padding:12px 20px 4px;'+(stateResults.length ? 'border-top:1px solid rgba(255,255,255,0.04);' : '')+'"><div style="color:'+GOLD+';font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;">Races</div></div>';
        for (var k = 0; k < raceResults.length; k++) {
          html += '<div class="stride-search-item" data-search-race-state="'+(raceResults[k].stateCode||'')+'" style="padding:10px 20px;cursor:pointer;transition:background 0.15s;">'
            + '<div style="color:'+CREAM+';font-size:14px;">'+esc(raceResults[k].name)+'</div>'
            + '<div style="color:'+SLATE+';font-size:12px;margin-top:2px;">'+esc(raceResults[k].type)+' \u00B7 '+esc(raceResults[k].date)+' \u00B7 '+esc(raceResults[k].state)+'</div></div>';
        }
      }

      dropdown.innerHTML = html;

      var items = dropdown.querySelectorAll(".stride-search-item");
      for (var m = 0; m < items.length; m++) {
        items[m].addEventListener("mouseenter", function() { this.style.background = "rgba(201,168,76,0.08)"; });
        items[m].addEventListener("mouseleave", function() { this.style.background = "transparent"; });
        items[m].addEventListener("click", function() {
          var sc = this.getAttribute("data-search-state");
          var rc = this.getAttribute("data-search-race-state");
          if (sc) navigateTo("state", sc);
          else if (rc) navigateTo("state", rc);
          input.value = "";
          dropdown.style.display = "none";
        });
      }
    }
  }

  /* ════
     STATE PAGE — populates existing HTML
     ════ */
  function renderState(stateCode) {
    if (!stateCode) return;
    var st = STATES[stateCode];
    if (!st) return;

    currentFilter = "All";
    /* Use real CMS races for this state if available, otherwise generate demo */
    if (cmsRaces) {
      currentStateRaces = [];
      for (var ri = 0; ri < allRaces.length; ri++) {
        if (allRaces[ri].stateCode === stateCode) currentStateRaces.push(allRaces[ri]);
      }
    } else {
      currentStateRaces = generateRaces(stateCode);
    }

    /* Set state name & count */
    var nameEl = document.getElementById("stride-state-name");
    var countEl = document.getElementById("stride-state-count");
    if (nameEl) nameEl.textContent = st.n;
    if (countEl) countEl.textContent = currentStateRaces.length + " upcoming races \u00B7 Updated weekly";

    /* Build filter buttons */
    var filterWrap = document.getElementById("stride-type-filters");
    if (filterWrap) {
      var types = ["All"].concat(RACE_TYPES);
      var fhtml = "";
      for (var i = 0; i < types.length; i++) {
        var active = currentFilter === types[i];
        fhtml += '<button class="stride-type-btn" data-type="'+esc(types[i])+'" style="background:'+(active ? GOLD : CHARCOAL)+';color:'+(active ? MIDNIGHT : SLATE)+';border:1px solid '+(active ? GOLD : 'rgba(255,255,255,0.06)')+';border-radius:24px;padding:8px 18px;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;">'+esc(types[i])+'</button>';
      }
      filterWrap.innerHTML = fhtml;

      var btns = filterWrap.querySelectorAll(".stride-type-btn");
      for (var j = 0; j < btns.length; j++) {
        btns[j].addEventListener("click", function() {
          currentFilter = this.getAttribute("data-type");
          updateFilterButtons();
          updateStateRaces();
        });
      }
    }

    /* Render race cards */
    updateStateRaces();

    /* State Map (Mapbox) */
    buildStateMap(stateCode);

    /* Back link */
    var backLink = document.querySelector('.stride-page-state .stride-back-link');
    if (backLink) {
      var newBack = backLink.cloneNode(true);
      backLink.parentNode.replaceChild(newBack, backLink);
      newBack.addEventListener("click", function(e) {
        e.preventDefault();
        navigateTo("home");
      });
    }

    /* Alert button */
    var alertBtn = document.getElementById("stride-alert-btn");
    if (alertBtn) {
      var newAlert = alertBtn.cloneNode(true);
      alertBtn.parentNode.replaceChild(newAlert, alertBtn);
      newAlert.addEventListener("click", function() {
        this.textContent = "Alert Set \u2713";
        this.style.background = "rgba(74,158,125,0.15)";
        this.style.color = GREEN;
        this.style.borderColor = GREEN;
      });
    }
  }

  function updateFilterButtons() {
    var btns = document.querySelectorAll(".stride-type-btn");
    for (var i = 0; i < btns.length; i++) {
      var active = btns[i].getAttribute("data-type") === currentFilter;
      btns[i].style.background = active ? GOLD : CHARCOAL;
      btns[i].style.color = active ? MIDNIGHT : SLATE;
      btns[i].style.borderColor = active ? GOLD : "rgba(255,255,255,0.06)";
    }
  }

  function updateStateRaces() {
    var grid = document.getElementById("stride-state-grid");
    var empty = document.getElementById("stride-state-empty");
    if (!grid) return;

    var filtered = [];
    for (var i = 0; i < currentStateRaces.length; i++) {
      if (currentFilter === "All" || currentStateRaces[i].type === currentFilter) {
        filtered.push(currentStateRaces[i]);
      }
    }

    if (filtered.length === 0) {
      grid.style.display = "none";
      if (empty) {
        empty.style.display = "block";
        var emptyText = empty.querySelector(".stride-empty-text");
        if (emptyText) emptyText.textContent = "No " + currentFilter + " races found. Try adjusting your selection.";
      }
    } else {
      grid.style.display = "";
      if (empty) empty.style.display = "none";
      var html = "";
      for (var j = 0; j < filtered.length; j++) html += raceCardHTML(filtered[j]);
      grid.innerHTML = html;
      addHovers(grid);
    }
  }

  /* ── State Map (Mapbox) ── */
  var G="32.8,-86.8,6|64.2,-152,4|34.3,-111.7,6|34.8,-92.2,6.5|37.2,-119.5,5.5|39,-105.5,6.5|41.6,-72.7,8|39,-75.5,8|28.1,-81.6,6|32.7,-83.5,6.5|20.5,-157,6|44.4,-114.7,5.5|40,-89.2,6|39.8,-86.3,6.5|42,-93.5,6.5|38.5,-98.3,6.5|37.8,-85.7,6.5|31,-91.8,6.5|45.4,-69.2,6.5|39.1,-76.7,7|42.2,-71.8,7.5|44.3,-84.5,6|46.3,-94.3,6|32.7,-89.7,6.5|38.4,-92.5,6.5|47,-109.6,5.5|41.5,-99.8,6.5|39,-116.8,5.5|43.7,-71.6,7|40.1,-74.7,7.5|34.5,-106,6|42.9,-75.5,6.5|35.6,-79.4,6.5|47.5,-100.4,6.5|40.4,-82.8,6.5|35.5,-97.5,6.5|43.8,-120.6,6|41,-77.6,6.5|41.7,-71.5,9|34,-81,7|44.4,-100.2,6.5|35.8,-86.4,6.5|31.2,-99.4,5.5|39.3,-111.7,6|44,-72.7,7|37.5,-78.8,6.5|47.4,-120.7,6.5|38.6,-80.6,7|44.6,-89.7,6|43,-107.5,6.5";
  var GEO={},GK=Object.keys(STATES),GP=G.split("|");
  for(var gi=0;gi<GK.length;gi++){var gp=GP[gi].split(",");GEO[GK[gi]]=[+gp[0],+gp[1],+gp[2]];}
  var sMap=null;
  function buildStateMap(sc){
    var el=document.getElementById("stride-state-map");
    if(!el||typeof mapboxgl==="undefined")return;
    var g=GEO[sc];if(!g)return;
    mapboxgl.accessToken="MAPBOX_TOKEN_REMOVED";
    if(sMap){sMap.remove();sMap=null;}
    sMap=new mapboxgl.Map({container:el,style:"mapbox://styles/mapbox/dark-v11",center:[g[1],g[0]],zoom:g[2],attributionControl:false});
    sMap.addControl(new mapboxgl.NavigationControl({showCompass:false}),"top-right");
    sMap.on("load",function(){
      var ly=sMap.getStyle().layers;
      for(var i=0;i<ly.length;i++){var l=ly[i];
        if(l.type==="line"&&l.id.indexOf("road")>-1)sMap.setPaintProperty(l.id,"line-color","rgba(201,168,76,0.25)");
        else if(l.type==="line"&&l.id.indexOf("bound")>-1)sMap.setPaintProperty(l.id,"line-color","rgba(201,168,76,0.4)");
        else if(l.type==="symbol"&&l.id.indexOf("label")>-1){try{sMap.setPaintProperty(l.id,"text-color","rgba(245,241,231,0.6)");}catch(e){}}
        else if(l.type==="fill"&&l.id.indexOf("water")>-1)sMap.setPaintProperty(l.id,"fill-color","#0a0f14");
      }
      try{sMap.setPaintProperty("background","background-color","#12140d");}catch(e){}

        var mC=race.lat&&race.lng?[race.lng,race.lat]:[g[1]+(Math.random()-0.5)*2,g[0]+(Math.random()-0.5)*1.5];
        new mapboxgl.Marker({element:mk}).setLngLat(mC).setPopup(pp).addTo(sMap);
      }
    });
  }

    if (metaEl) {
      metaEl.innerHTML = '<div style="display:flex;gap:20px;margin-bottom:48px;color:'+STONE+';font-size:13px;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:20px;">'
        + '<span>By <strong style="color:'+CREAM+';">'+esc(article.auth)+'</strong></span>'
        + '<span>\u00B7</span><span>'+esc(article.dt)+'</span>'
        + '<span>\u00B7</span><span>'+esc(article.rt)+'</span></div>';
    }

    /* Content */
    var contentEl = document.getElementById("stride-article-content");
    if (contentEl) {
      var html = "";
      if (article.content) {
        for (var i = 0; i < article.content.length; i++) {
          var block = article.content[i];
          if (block.t === "intro") html += '<p style="color:#B8AE9C;font-size:19px;line-height:1.85;margin-bottom:32px;font-family:Georgia,serif;">'+esc(block.tx)+'</p>';
          else if (block.t === "h") html += '<h2 style="color:'+CREAM+';font-size:24px;font-family:Georgia,serif;margin-top:48px;margin-bottom:16px;">'+esc(block.tx)+'</h2>';
          else if (block.t === "p") html += '<p style="color:'+STONE+';font-size:16px;line-height:1.85;margin-bottom:20px;">'+esc(block.tx)+'</p>';
          else if (block.t === "q") html += '<blockquote style="border-left:3px solid '+GOLD+';margin:40px 0;padding:16px 24px;background:rgba(201,168,76,0.04);border-radius:0 12px 12px 0;"><p style="color:'+CREAM+';font-size:18px;font-style:italic;font-family:Georgia,serif;line-height:1.7;margin:0;">'+esc(block.tx)+'</p></blockquote>';
          else if (block.t === "html") html += '<div style="color:'+STONE+';font-size:16px;line-height:1.85;">'+block.tx+'</div>';
          else if (block.t === "side") {
            html += '<div style="background:'+NAVY+';border:1px solid rgba(201,168,76,0.15);border-radius:16px;padding:28px;margin:40px 0;"><div style="color:'+GOLD+';font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:16px;">'+esc(block.title)+'</div>';
            for (var b = 0; b < block.items.length; b++) html += '<div style="color:'+STONE+';font-size:14px;margin-bottom:10px;padding-left:16px;border-left:2px solid rgba(201,168,76,0.2);">'+esc(block.items[b])+'</div>';
            html += '</div>';
          }
        }
      } else {
        html = '<div style="color:'+STONE+';font-size:17px;line-height:1.85;">'+esc(article.exc)+'<div style="color:'+ASH+';margin-top:40px;text-align:center;font-style:italic;">Full article coming soon...</div></div>';
      }
      contentEl.innerHTML = html;
    }

    /* Back link */
    var backLink = document.querySelector('.stride-page-article .stride-back-link');
    if (backLink) {
      var newBack = backLink.cloneNode(true);
      backLink.parentNode.replaceChild(newBack, backLink);
      newBack.addEventListener("click", function(e) {
        e.preventDefault();
        navigateTo("editorial");
      });
    }
  }

  /* ════
     SUBMIT PAGE — add interactivity to existing HTML
     ════ */
  function renderSubmit() {
    var form = document.getElementById("stride-submit-form");
    var msg = document.getElementById("stride-submit-message");
    if (form) {
      var newForm = form.cloneNode(true);
      form.parentNode.replaceChild(newForm, form);
      newForm.addEventListener("submit", function(e) {
        e.preventDefault();
        if (msg) {
          msg.style.display = "block";
          msg.innerHTML = '<div style="text-align:center;padding:24px;"><div style="font-size:48px;margin-bottom:16px;">\u{1F389}</div><div style="color:'+CREAM+';font-size:20px;font-weight:700;margin-bottom:8px;">Race Submitted!</div><div style="color:'+STONE+';font-size:14px;">We\'ll review your listing within 48 hours.</div></div>';
          newForm.style.display = "none";
        }
      });

      /* Focus effects on inputs */
      var inputs = newForm.querySelectorAll(".stride-form-input, .stride-form-select");
      for (var i = 0; i < inputs.length; i++) {
        inputs[i].addEventListener("focus", function() { this.style.borderColor = "rgba(201,168,76,0.5)"; });
        inputs[i].addEventListener("blur", function() { this.style.borderColor = "rgba(255,255,255,0.08)"; });
      }
    }

    /* Tier card selection */
    var tierCards = document.querySelectorAll('.stride-page-submit .stride-tier-card');
    for (var j = 0; j < tierCards.length; j++) {
      tierCards[j].addEventListener("mouseenter", function() { this.style.transform = "translateY(-3px)"; });
      tierCards[j].addEventListener("mouseleave", function() { this.style.transform = "translateY(0)"; });
    }
  }

  /* ════
     PARTNER PAGE — add interactivity to existing HTML
     ════ */
  function renderPartner() {
    var cards = document.querySelectorAll('.stride-page-partner .stride-partner-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener("mouseenter", function() { this.style.transform = "translateY(-4px)"; });
      cards[i].addEventListener("mouseleave", function() { this.style.transform = "translateY(0)"; });
    }

    /* Media kit & schedule buttons */
    var mediaBtn = document.getElementById("stride-media-kit-btn");
    if (mediaBtn) {
      mediaBtn.addEventListener("click", function(e) {
        e.preventDefault();
        alert("Media kit download coming soon!");
      });
    }
    var schedBtn = document.getElementById("stride-schedule-btn");
    if (schedBtn) {
      schedBtn.addEventListener("click", function(e) {
        e.preventDefault();
        alert("Scheduling page coming soon!");
      });
    }
  }

  /* ════
     GLOBAL NAV CLICK HANDLERS
     ════ */
  var allNavLinks = document.querySelectorAll("[data-page]");
  for (var ni = 0; ni < allNavLinks.length; ni++) {
    allNavLinks[ni].addEventListener("click", function(e) {
      e.preventDefault();
      navigateTo(this.getAttribute("data-page"));
    });
    allNavLinks[ni].addEventListener("mouseenter", function() { this.style.color = GOLD; });
    allNavLinks[ni].addEventListener("mouseleave", function() {
      if (this.getAttribute("data-page") !== currentPage) this.style.color = SLATE;
    });
  }

  /* Logo click */
  var logo = document.querySelector(".stride-logo");
  if (logo) {
    logo.style.cursor = "pointer";
    logo.addEventListener("click", function() { window.location.hash = ""; navigateTo("home"); });
  }

  function routeHash(){var h=(window.location.hash||"").replace("#","");
  if(h.indexOf("/state/")===0){var s=h.substr(7).toUpperCase();if(STATES[s])return navigateTo("state",s);}
  else if(h==="/editorial")return navigateTo("editorial");
  else if(h==="/submit")return navigateTo("submit");
  else if(h==="/partner")return navigateTo("partner");
  navigateTo("home");}
  routeHash();window.addEventListener("hashchange",routeHash);
});
</script>
