<style>
/* ============================================
   STRIDE — DESIGN SYSTEM
   Race Discovery Platform — Dark Theme
   ============================================ */

/* ── CSS Custom Properties ── */
:root {
  --stride-midnight: #0A0E17;
  --stride-navy: #131A2B;
  --stride-charcoal: #1C2333;
  --stride-gold: #C9A84C;
  --stride-gold-dk: #A0873D;
  --stride-cream: #E8DCC8;
  --stride-stone: #8A8577;
  --stride-slate: #6B7B8D;
  --stride-ash: #4A4640;
  --stride-terra: #E07A5F;
  --stride-green: #4A9E7D;
  --stride-white: #FFFFFF;
  --stride-font-heading: Georgia, 'Times New Roman', serif;
  --stride-font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  --stride-container-max: 1200px;
  --stride-transition-fast: 150ms ease;
  --stride-transition-base: 300ms ease;
  --stride-transition-card: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  --stride-radius-sm: 10px;
  --stride-radius-md: 12px;
  --stride-radius-lg: 16px;
  --stride-radius-xl: 20px;
  --stride-radius-pill: 24px;
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--stride-font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--stride-cream);
  background-color: var(--stride-midnight);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img { max-width: 100%; height: auto; display: block; }
a { color: var(--stride-slate); text-decoration: none; transition: color var(--stride-transition-fast); }
a:hover { color: var(--stride-gold); }

/* ── Custom Scrollbar ── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--stride-midnight); }
::-webkit-scrollbar-thumb { background: var(--stride-charcoal); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--stride-ash); }

/* Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--stride-charcoal) var(--stride-midnight);
}


/* ============================================
   LAYOUT
   ============================================ */

.stride-page {
  background-color: var(--stride-midnight);
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--stride-cream);
}

.stride-container {
  width: 100%;
  max-width: var(--stride-container-max);
  margin: 0 auto;
  padding: 0 24px;
}


/* ============================================
   NAVIGATION (Fixed Top)
   ============================================ */

.stride-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background-color: rgba(10, 14, 23, 0.82);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid rgba(201, 168, 76, 0.08);
  transition: box-shadow var(--stride-transition-base);
}

.stride-nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  max-width: var(--stride-container-max);
  margin: 0 auto;
  padding: 0 24px;
}

.stride-logo {
  font-family: var(--stride-font-heading);
  font-size: 20px;
  font-weight: 700;
  color: var(--stride-cream);
  letter-spacing: 5px;
  text-transform: uppercase;
  text-decoration: none;
}

.stride-logo:hover { color: var(--stride-cream); }

.stride-nav-links {
  display: flex;
  align-items: center;
  gap: 28px;
}

.stride-nav-links a {
  font-size: 12px;
  font-weight: 600;
  color: var(--stride-slate);
  text-decoration: none;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: color var(--stride-transition-fast);
}

.stride-nav-links a:hover { color: var(--stride-gold); }


/* ============================================
   HERO SECTION
   ============================================ */

.stride-hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 100px 24px 40px;
  position: relative;
}

.stride-hero-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--stride-gold);
  background-color: rgba(201, 168, 76, 0.08);
  padding: 8px 24px;
  border-radius: var(--stride-radius-pill);
  border: 1px solid rgba(201, 168, 76, 0.15);
  margin-bottom: 32px;
}

.stride-hero-title {
  font-family: var(--stride-font-heading);
  font-size: clamp(48px, 6.5vw, 72px);
  font-weight: 700;
  color: var(--stride-cream);
  line-height: 1.05;
  margin-bottom: 24px;
  letter-spacing: -0.02em;
}

.stride-hero-title span {
  color: var(--stride-gold);
  text-shadow: 0 0 60px rgba(201, 168, 76, 0.3);
}

.stride-hero-sub {
  font-size: 17px;
  color: var(--stride-stone);
  max-width: 520px;
  margin: 0 auto 40px;
  line-height: 1.75;
}


/* ============================================
   SEARCH
   ============================================ */

.stride-search {
  position: relative;
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
}

.stride-search-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  background-color: var(--stride-charcoal);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--stride-radius-lg);
  padding: 14px 20px;
  transition: border-color var(--stride-transition-base);
}

.stride-search-bar.focused {
  border-color: rgba(201, 168, 76, 0.5);
}

.stride-search-bar.has-results {
  border-radius: var(--stride-radius-lg) var(--stride-radius-lg) 0 0;
}

.stride-search-input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--stride-cream);
  font-family: var(--stride-font-body);
  font-size: 15px;
  width: 100%;
  line-height: 1.4;
}

.stride-search-input::placeholder {
  color: var(--stride-ash);
}

.stride-search-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  width: 100%;
  background-color: var(--stride-navy);
  border: 1px solid rgba(201, 168, 76, 0.3);
  border-top: none;
  border-radius: 0 0 var(--stride-radius-lg) var(--stride-radius-lg);
  max-height: 380px;
  overflow-y: auto;
  z-index: 50;
}

.stride-search-category {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--stride-gold);
  padding: 12px 20px 4px;
}

.stride-search-item {
  padding: 10px 20px;
  cursor: pointer;
  transition: background-color var(--stride-transition-fast);
  color: var(--stride-cream);
  font-size: 14px;
}

.stride-search-item:hover {
  background-color: rgba(201, 168, 76, 0.08);
}


/* ============================================
   SVG MAP
   ============================================ */

.stride-map {
  position: relative;
  max-width: 800px;
  margin: 0 auto;
}

.stride-map svg {
  width: 100%;
  height: auto;
  display: block;
}

.stride-map-tooltip {
  position: absolute;
  top: 10px;
  right: 10px;
  background-color: var(--stride-navy);
  border: 1px solid rgba(201, 168, 76, 0.3);
  border-radius: 14px;
  padding: 14px 20px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 10;
}


/* ============================================
   SECTION HEADERS
   ============================================ */

.stride-section-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--stride-gold);
  margin-bottom: 8px;
}

.stride-section-title {
  font-family: var(--stride-font-heading);
  font-size: 34px;
  font-weight: 700;
  color: var(--stride-cream);
  line-height: 1.2;
}


/* ============================================
   IMAGE CARDS (Base — Race & Editorial)
   ============================================ */

.stride-img-card {
  border-radius: var(--stride-radius-lg);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all var(--stride-transition-card);

.stride-img-card:hover {

   RACE CARDS

.stride-race-card {

.stride-terrain-gold {
  background-color: rgba(201, 168, 76, 0.15);

}

.stride-terrain-green {

.stride-terrain-terra {

.stride-race-name {

.stride-race-meta {

.stride-race-footer {

  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.1);

}

.stride-race-stats {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.55);
}

.stride-race-price {
  font-size: 15px;

}


/* ============================================
   EDITORIAL CARDS
   ============================================ */

.stride-edit-card {
  height: 100%;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: var(--stride-radius-lg);

  transition: all var(--stride-transition-card);
}

.stride-edit-card:hover {
  transform: translateY(-5px) scale(1.01);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
}

.stride-edit-tag {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--stride-gold);
  margin-bottom: 8px;
}

.stride-edit-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--stride-white);
  line-height: 1.2;
  margin-bottom: 8px;
}

.stride-edit-title.big {
  font-size: 28px;
}

.stride-edit-sub {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.7);
  font-style: italic;
  line-height: 1.5;

}

.stride-edit-author {
  font-size: 11px;

}

.stride-edit-time {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.35);
}


/* ============================================
   TYPE FILTER BUTTONS (State Page)
   ============================================ */

.stride-filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background-color: var(--stride-charcoal);

  padding: 8px 18px;
  font-family: var(--stride-font-body);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--stride-transition-fast);

}

.stride-filter-btn:hover {
  border-color: rgba(255, 255, 255, 0.15);

}

.stride-filter-btn.active {

}


/* ============================================
   SIDEBAR CARDS (State Page)
   ============================================ */

.stride-sidebar-card {
  background-color: var(--stride-navy);
  border: 1px solid rgba(255, 255, 255, 0.06);

}

.stride-sidebar-card.hotel {

}


/* ============================================
   ARTICLE PAGE
   ============================================ */

.stride-article-intro {

}

.stride-article-heading {

.stride-email-btn {

  padding: 14px 28px;
  font-family: var(--stride-font-body);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;

}

.stride-email-btn:hover {

.stride-tier-card {

.stride-btn-primary:hover {

}

.stride-btn-outline {

  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--stride-gold);
  border: 1px solid rgba(201, 168, 76, 0.4);
  border-radius: var(--stride-radius-md);
  padding: 14px 28px;
  font-family: var(--stride-font-body);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;

  color: var(--stride-gold);
}

.stride-btn-ghost {

  align-items: center;
  justify-content: center;
  background-color: rgba(201, 168, 76, 0.1);
  color: var(--stride-gold);
  border: 1px solid rgba(201, 168, 76, 0.3);
  border-radius: var(--stride-radius-md);
  padding: 14px 28px;
  font-family: var(--stride-font-body);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all var(--stride-transition-base);
  text-decoration: none;
  white-space: nowrap;
}

.stride-btn-ghost:hover {
  background-color: rgba(201, 168, 76, 0.18);
  color: var(--stride-gold);
}


/* ============================================

   ============================================ */

.stride-brands {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 48px;
  flex-wrap: wrap;
  padding: 32px 0;
}

.stride-brands img {
  height: 28px;
  width: auto;
  opacity: 0.4;
  filter: grayscale(1) brightness(2);
  transition: opacity var(--stride-transition-fast);
}

.stride-brands img:hover {
  opacity: 0.7;
}


/* ============================================
   FOOTER
   ============================================ */

.stride-footer {
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding: 48px 24px;
  max-width: var(--stride-container-max);
  margin: 0 auto;
}

.stride-footer-grid {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 32px;
}

.stride-footer-links {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.stride-footer-links h4 {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--stride-gold);
  margin-bottom: 4px;
  font-family: var(--stride-font-body);
}

.stride-footer-links a {
  font-size: 13px;
  color: var(--stride-slate);
  text-decoration: none;
  transition: color var(--stride-transition-fast);
}

.stride-footer-links a:hover {
  color: var(--stride-cream);
}

.stride-footer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  margin-top: 40px;
  padding-top: 24px;
  font-size: 12px;
  color: var(--stride-ash);
}


/* ============================================
   PAGE VISIBILITY (SPA-Style Navigation)
   ============================================ */

.stride-page-section {
  display: none;
}

.stride-page-section.active {
  display: block;
}


/* ============================================
   UTILITY: GRIDS
   ============================================ */

.stride-grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}

.stride-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.stride-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}


/* ============================================
   UTILITY: TEXT
   ============================================ */

.stride-text-center { text-align: center; }
.stride-text-left { text-align: left; }
.stride-text-right { text-align: right; }
.stride-text-gold { color: var(--stride-gold); }
.stride-text-cream { color: var(--stride-cream); }
.stride-text-stone { color: var(--stride-stone); }
.stride-text-slate { color: var(--stride-slate); }
.stride-text-ash { color: var(--stride-ash); }
.stride-text-white { color: var(--stride-white); }


/* ============================================
   UTILITY: SPACING
   ============================================ */

.stride-mb-0 { margin-bottom: 0; }
.stride-mb-4 { margin-bottom: 4px; }
.stride-mb-8 { margin-bottom: 8px; }
.stride-mb-12 { margin-bottom: 12px; }
.stride-mb-16 { margin-bottom: 16px; }
.stride-mb-20 { margin-bottom: 20px; }
.stride-mb-24 { margin-bottom: 24px; }
.stride-mb-32 { margin-bottom: 32px; }
.stride-mb-40 { margin-bottom: 40px; }
.stride-mb-48 { margin-bottom: 48px; }
.stride-mb-56 { margin-bottom: 56px; }
.stride-mb-64 { margin-bottom: 64px; }
.stride-mb-80 { margin-bottom: 80px; }

.stride-mt-0 { margin-top: 0; }
.stride-mt-8 { margin-top: 8px; }
.stride-mt-16 { margin-top: 16px; }
.stride-mt-24 { margin-top: 24px; }
.stride-mt-32 { margin-top: 32px; }
.stride-mt-40 { margin-top: 40px; }
.stride-mt-48 { margin-top: 48px; }
.stride-mt-64 { margin-top: 64px; }

.stride-pt-0 { padding-top: 0; }
.stride-pt-24 { padding-top: 24px; }
.stride-pt-32 { padding-top: 32px; }
.stride-pt-48 { padding-top: 48px; }
.stride-pt-64 { padding-top: 64px; }
.stride-pt-80 { padding-top: 80px; }

.stride-pb-0 { padding-bottom: 0; }
.stride-pb-24 { padding-bottom: 24px; }
.stride-pb-32 { padding-bottom: 32px; }
.stride-pb-48 { padding-bottom: 48px; }
.stride-pb-64 { padding-bottom: 64px; }
.stride-pb-80 { padding-bottom: 80px; }

.stride-py-24 { padding-top: 24px; padding-bottom: 24px; }
.stride-py-40 { padding-top: 40px; padding-bottom: 40px; }
.stride-py-48 { padding-top: 48px; padding-bottom: 48px; }
.stride-py-64 { padding-top: 64px; padding-bottom: 64px; }
.stride-py-80 { padding-top: 80px; padding-bottom: 80px; }

.stride-flex { display: flex; }
.stride-flex-col { display: flex; flex-direction: column; }
.stride-flex-center { display: flex; align-items: center; justify-content: center; }
.stride-flex-between { display: flex; align-items: center; justify-content: space-between; }
.stride-flex-wrap { flex-wrap: wrap; }
.stride-gap-8 { gap: 8px; }
.stride-gap-12 { gap: 12px; }
.stride-gap-16 { gap: 16px; }
.stride-gap-20 { gap: 20px; }
.stride-gap-24 { gap: 24px; }
.stride-gap-32 { gap: 32px; }

.stride-bg-forest  { background: linear-gradient(135deg, #2A3D2E, #0A0E17); }
.stride-bg-coast   { background: linear-gradient(135deg, #4A3020, #1E0F08); }

  left: 50%;
  transform: translateX(-50%);

  color: var(--stride-midnight);
  padding: 12px 24px;
  border-radius: 0 0 var(--stride-radius-md) var(--stride-radius-md);
  font-size: 14px;
  font-weight: 700;
  z-index: 200;
  transition: top var(--stride-transition-fast);
  text-decoration: none;
}

.stride-skip-link:focus {
  top: 0;
  color: var(--stride-midnight);
  outline: 2px solid var(--stride-cream);
  outline-offset: 2px;
}

.stride-btn-outline:focus-visible,
.stride-btn-ghost:focus-visible,
.stride-email-btn:focus-visible,

  outline-offset: 2px;
}

   ============================================ */

@media (prefers-reduced-motion: reduce) {

  }

  .stride-grid-2 {
    grid-template-columns: 1fr;
  }

  .stride-grid-4 {
    grid-template-columns: 1fr 1fr;
  }

  .stride-footer-grid {
    flex-direction: column;
    gap: 28px;
  }

  .stride-footer-bottom {
    flex-direction: column;
    text-align: center;

  }

  }

    padding: 0 16px;
  }

  .stride-nav-inner {

    font-size: 16px;
    letter-spacing: 3px;
  }

  .stride-nav-links {

    padding: 100px 16px 32px;

    font-size: clamp(32px, 10vw, 40px);

  }
}
