    KY:{n:"Kentucky",x:590,y:270,r:10},LA:{n:"Louisiana",x:500,y:390,r:9},ME:{n:"Maine",x:740,y:90,r:11},MD:{n:"Maryland",x:690,y:230,r:14},
    MA:{n:"Massachusetts",x:730,y:155,r:18},MI:{n:"Michigan",x:570,y:160,r:16},MN:{n:"Minnesota",x:440,y:120,r:14},MS:{n:"Mississippi",x:540,y:360,r:6},

    SD:{n:"South Dakota",x:380,y:160,r:5},TN:{n:"Tennessee",x:570,y:300,r:16},TX:{n:"Texas",x:370,y:380,r:38},UT:{n:"Utah",x:210,y:230,r:15},
    VT:{n:"Vermont",x:720,y:115,r:7},VA:{n:"Virginia",x:660,y:260,r:20},WA:{n:"Washington",x:120,y:80,r:22},WV:{n:"West Virginia",x:640,y:250,r:8},
    WI:{n:"Wisconsin",x:500,y:150,r:13},WY:{n:"Wyoming",x:270,y:170,r:6}

  var TYPES = ["Marathon","Half Marathon","10K","5K","Ultra","Triathlon","Trail Run"];

  // ─── IMAGE / CARD BACKGROUNDS ──────────────
  var IMGS = [
    {bg:"linear-gradient(135deg,"+charcoal+","+midnight+")",ic:"\uD83C\uDFD4\uFE0F",lb:"Mountain",tag:"Road",tagCol:gold},
    {bg:"linear-gradient(135deg,#2A3D2E,"+midnight+")",ic:"\uD83C\uDF32",lb:"Forest",tag:"Trail",tagCol:green},
    {bg:"linear-gradient(135deg,#4A3020,#1E0F08)",ic:"\uD83C\uDF05",lb:"Coast",tag:"Road",tagCol:gold},

  // ─── RACE GENERATOR ─────────────────────────
  function genRaces(sc) {
    var s = ST[sc];
    if (!s) return [];
    var tpl = [
      {n: s.n + " Marathon", t: "Marathon", tr: "Road", f: 1, p: "$120", ii: 0},
      {n: s.n + " Half Marathon", t: "Half Marathon", tr: "Road", f: 0, p: "$85", ii: 2},
      {n: "Downtown " + s.n + " 10K", t: "10K", tr: "Road", f: 0, p: "$45", ii: 3},
      {n: s.n + " Trail Ultra 50K", t: "Ultra", tr: "Trail", f: 1, p: "$175", ii: 1},
      {n: s.n + " Sprint Triathlon", t: "Triathlon", tr: "Mixed", f: 0, p: "$130", ii: 6},
      {n: s.n + " Mountain Challenge", t: "Trail Run", tr: "Mountain", f: 1, p: "$95", ii: 5},
      {n: "Sunset " + s.n + " 5K", t: "5K", tr: "Beach", f: 0, p: "$35", ii: 4},
      {n: s.n + " Iron Distance Tri", t: "Triathlon", tr: "Mixed", f: 1, p: "$350", ii: 0},
      {n: s.n + " Heritage Run", t: "Half Marathon", tr: "Road", f: 0, p: "$75", ii: 3},
      {n: s.n + " Night Run 10K", t: "10K", tr: "Road", f: 0, p: "$50", ii: 7},
      {n: s.n + " Endurance Fest", t: "Ultra", tr: "Trail", f: 1, p: "$200", ii: 1},
      {n: "Lake " + s.n + " Triathlon", t: "Triathlon", tr: "Mixed", f: 0, p: "$145", ii: 6}
    ];
    var count = Math.min(s.r, 12);
    var result = [];
    for (var i = 0; i < count; i++) {
      var r = tpl[i];
      result.push({
        id: sc + "-" + i,
        name: r.n,
        type: r.t,
        terrain: r.tr,
        featured: !!r.f,
        img: IMGS[r.ii],
        price: r.p,
        date: MO[(i * 3 + sc.charCodeAt(0)) % 12] + " " + ((i * 7 + 5) % 28 + 1) + ", 2026",
        city: s.n + " City",
        state: s.n,
        stateCode: sc,
        participants: Math.floor(Math.random() * 5000) + 500,
        rating: (4 + Math.random()).toFixed(1)
      });
    }
    return result;
  }

  // ─── ALL RACES (pre-generated) ──────────────
  var ALL_R = [];
  var stateKeys = Object.keys(ST);
  for (var si = 0; si < stateKeys.length; si++) {
    var generated = genRaces(stateKeys[si]);
    for (var gi = 0; gi < generated.length; gi++) {
      ALL_R.push(generated[gi]);
    }
  }

  // ─── EDITORIAL ARTICLES ─────────────────────
  var EDIT = [
    {
      id: 1,
      title: "48 Hours in Big Sur",
      sub: "Run the Marathon, Stay for the Magic",
      tag: "RACE-CATION GUIDE",
      rt: "8 min",
      exc: "The Big Sur International Marathon isn't just a race \u2014 it's a pilgrimage. Here's how to turn 26.2 miles of coastline into the weekend of a lifetime.",
      feat: 1,
      img: IMGS[2],
      auth: "Sarah Chen",
      dt: "Jan 15, 2026",
      content: [
        {t: "intro", tx: "There are marathons you run, and then there are marathons you experience. The Big Sur International Marathon belongs firmly in the latter category \u2014 a 26.2-mile journey along one of the most breathtaking stretches of coastline on Earth."},
        {t: "h", tx: "Day One: Arrive, Breathe, Prepare"},
        {t: "p", tx: "Fly into Monterey Regional Airport, a small, stress-free airport that immediately sets the tone. Pick up your rental and drive south along Highway 1 \u2014 arguably the most scenic commute to a hotel you'll ever make. Check into Ventana Big Sur or Post Ranch Inn if you're going all out, or a charming Airbnb in Carmel Valley for something more intimate."},
        {t: "p", tx: "Spend your afternoon doing a gentle shakeout run along the Carmel River Trail \u2014 flat, forested, and a world away from the drama of tomorrow's course. Have dinner at Sierra Mar at Post Ranch Inn, perched 1,200 feet above the Pacific."},
        {t: "h", tx: "Day Two: Race Day Magic"},
        {t: "p", tx: "The Big Sur Marathon starts in the dark, and that's part of the magic. Buses carry runners south to Pfeiffer Big Sur State Park, and as the sun rises over the Santa Lucia Mountains, you'll understand why people fly across the world for this."},
        {t: "q", tx: "You don't run Big Sur for a PR. You run it for the photos, the tears at Bixby Bridge, and the story you'll tell for the rest of your life."},
        {t: "h", tx: "Day Three: Recover Like Royalty"},
        {t: "p", tx: "This is where the race-cation earns its name. Book a deep tissue massage at Ventana. Soak in the Japanese hot baths overlooking the canyon. Have a long, slow brunch at Deetjen's Big Sur Inn."},
        {t: "side", title: "Where to Stay", items: ["Ventana Big Sur \u2014 From $750/night", "Post Ranch Inn \u2014 From $1,200/night", "Carmel Valley Ranch \u2014 From $450/night", "Airbnb Luxe, Carmel \u2014 From $300/night"]}
      ]
    },
    {id: 2, title: "The 10 Most Beautiful Races in America", sub: "Finish Lines Worth Flying For", tag: "EDITORIAL", rt: "12 min", exc: "From the volcanic trails of Hawaii to the covered bridges of Vermont, these are the races that redefine what a finish line can feel like.", feat: 1, img: IMGS[0], auth: "Marcus Rivera", dt: "Jan 8, 2026"},
    {id: 3, title: "Post-Race Recovery at The Ritz", sub: "When Your Cool Down Includes a Spa", tag: "LUXURY STAYS", rt: "6 min", exc: "The best luxury hotels near America's top races \u2014 because you deserve more than a foam roller after 13.1 miles.", feat: 0, img: IMGS[5], auth: "Emily Park", dt: "Dec 20, 2025"},
    {id: 4, title: "Chicago Marathon Race Recap 2025", sub: "Records, Rain, and Redemption", tag: "RACE RECAP", rt: "10 min", exc: "Over 40,000 runners took to the streets of Chicago for one of the most dramatic marathon days in recent memory.", feat: 0, img: IMGS[3], auth: "James Okafor", dt: "Oct 15, 2025"},
    {id: 5, title: "Planning a Tri-cation in Kona", sub: "The Ultimate Ironman Spectator Guide", tag: "RACE-CATION GUIDE", rt: "9 min", exc: "Even if you're not racing, Kona during Ironman week is unlike anything else on earth.", feat: 0, img: IMGS[6], auth: "Sarah Chen", dt: "Sep 28, 2025"}
  ];

  // ─── PARTNER TIERS ──────────────────────────
  var TIERS = [
    {name: "Presenting Sponsor", price: "$10,000/mo", color: gold, feats: ["Homepage hero placement","All state page banners","Editorial integration","Custom branded race guides","Monthly report","Priority support"]},
    {name: "Destination Partner", price: "$5,000/mo", color: stone, pop: 1, feats: ["State page sidebar","'Where to Stay' integration","Quarterly editorial feature","Race-cation guide placement","Analytics dashboard"]},
    {name: "Featured Brand", price: "$2,000/mo", color: slate, feats: ["Rotating banner ads","Race card sponsorship","Monthly newsletter feature","Basic analytics"]}
  ];

  // ─── HELPER: HTML ESCAPE ────────────────────
  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  // ─── HELPER: TERRAIN COLOR CLASS ────────────
  function terrainColor(t) {
    if (t === "Trail" || t === "Mountain") return green;
    if (t === "Mixed" || t === "Beach") return terra;
    return gold;
  }

  function terrainColorRgba(t) {
    if (t === "Trail" || t === "Mountain") return "74,158,125";
    if (t === "Mixed" || t === "Beach") return "224,122,95";
    return "201,168,76";
  }

  // ─── APP STATE ──────────────────────────────
  var currentPage = 'home';
  var selectedState = null;
  var selectedArticle = null;
  var typeFilter = 'All';
  var stateRaces = [];
  var submitTier = 'featured';
  var heroIndex = 0;
  var heroInterval = null;
  var searchFocused = false;

  var heros = [
    "linear-gradient(135deg,#1A1520," + navy + ",#1A2535," + midnight + ")",
    "linear-gradient(135deg," + midnight + ",#1A2028,#25201A," + midnight + ")",
    "linear-gradient(135deg,#1A1028,#20182E,#1A2535," + midnight + ")"
  ];

  // ─── NAVIGATE ───────────────────────────────
  function navigate(page, data) {
    currentPage = page;

    if (page === 'home') {
      selectedState = null;
      selectedArticle = null;
    }

    // Hide all pages
    var pages = document.querySelectorAll('[class*="stride-page-"]');
    for (var i = 0; i < pages.length; i++) {
      pages[i].classList.remove('active');
      pages[i].style.display = 'none';
    }

    // Show target page
    var target = document.querySelector('.stride-page-' + page);
    if (target) {
      target.classList.add('active');
      target.style.display = 'block';
    }

    // Update nav link highlights
    var navLinks = document.querySelectorAll('[data-page]');
    for (var j = 0; j < navLinks.length; j++) {
      var lp = navLinks[j].getAttribute('data-page');
      navLinks[j].style.color = (lp === page) ? gold : slate;
    }

    // Scroll to top
    window.scrollTo(0, 0);

    // Render page-specific content
    if (page === 'home') {
      renderHome();
    } else if (page === 'state') {
      renderStatePage(data);
    } else if (page === 'article') {
      renderArticlePage(data);
    } else if (page === 'editorial') {
      renderEditorialPage();
    } else if (page === 'submit') {
      renderSubmitPage();
    } else if (page === 'partner') {
      renderPartnerPage();
    }
  }

  // ─── RACE CARD HTML ─────────────────────────
  function renderRaceCard(r) {
    var tc = terrainColor(r.terrain);
    var tcRgba = terrainColorRgba(r.terrain);
    var featBadge = '';
    if (r.featured) {
      featBadge = '<div style="display:inline-block;background:linear-gradient(135deg,' + gold + ',' + goldDk + ');color:' + midnight + ';font-size:9px;font-weight:800;letter-spacing:1.5px;padding:3px 10px;border-radius:20px;text-transform:uppercase;margin-bottom:12px;">\u2605 Featured</div>';
    }
    var borderStyle = r.featured ? '1px solid rgba(201,168,76,0.4)' : '1px solid rgba(255,255,255,0.06)';

    return '<div class="stride-race-card" style="background:' + r.img.bg + ';border-radius:16px;position:relative;overflow:hidden;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);cursor:pointer;border:' + borderStyle + ';">' +
      '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.05) 0%,rgba(0,0,0,0.75) 100%);z-index:1;"></div>' +
      '<div style="position:absolute;top:16px;left:16px;font-size:40px;z-index:0;opacity:0.12;">' + r.img.ic + '</div>' +
      '<div style="position:relative;z-index:2;padding:24px;">' +
        featBadge +
        '<div style="font-size:36px;margin-bottom:12px;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.3));">' + r.img.ic + '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">' +
          '<span style="color:' + gold + ';font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;">' + esc(r.type) + '</span>' +
          '<span style="background:rgba(' + tcRgba + ',0.15);color:' + tc + ';font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:0.5px;">' + esc(r.terrain) + '</span>' +
        '</div>' +
        '<div style="color:' + white + ';font-size:18px;font-weight:700;line-height:1.3;margin-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,0.5);">' + esc(r.name) + '</div>' +
        '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;">' +
          '<span style="color:rgba(255,255,255,0.7);font-size:12px;">\uD83D\uDCC5 ' + esc(r.date) + '</span>' +
          '<span style="color:rgba(255,255,255,0.7);font-size:12px;">\uD83D\uDCCD ' + esc(r.city) + '</span>' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">' +
          '<span style="color:rgba(255,255,255,0.55);font-size:11px;">\u2B50 ' + r.rating + ' \u00B7 ' + r.participants.toLocaleString() + ' runners</span>' +
          '<span style="color:' + gold + ';font-weight:700;font-size:15px;">' + esc(r.price) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ─── EDITORIAL CARD HTML ────────────────────
  function renderEditCard(a, big) {
    var minH = big ? 340 : 200;
    var pad = big ? 36 : 24;
    var titleSize = big ? 28 : 18;
    var subSize = big ? 15 : 13;

    var excHtml = '';
    if (big) {
      excHtml = '<div style="color:rgba(255,255,255,0.55);font-size:13px;line-height:1.6;">' + esc(a.exc) + '</div>';
    }

    return '<div class="stride-edit-card" data-article-id="' + a.id + '" style="background:' + a.img.bg + ';border-radius:16px;position:relative;overflow:hidden;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);cursor:pointer;border:1px solid rgba(255,255,255,0.06);height:100%;">' +
      '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.05) 0%,rgba(0,0,0,0.75) 100%);z-index:1;"></div>' +
      (a.img.ic ? '<div style="position:absolute;top:16px;left:16px;font-size:40px;z-index:0;opacity:0.12;">' + a.img.ic + '</div>' : '') +
      '<div style="position:relative;z-index:2;padding:' + pad + 'px;display:flex;flex-direction:column;min-height:' + minH + 'px;">' +
        '<div style="color:' + gold + ';font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;">' + esc(a.tag) + '</div>' +
        '<div style="flex:1;">' +
          '<div style="color:' + white + ';font-size:' + titleSize + 'px;font-weight:800;line-height:1.2;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,0.5);">' + esc(a.title) + '</div>' +
          '<div style="color:rgba(255,255,255,0.7);font-size:' + subSize + 'px;font-style:italic;margin-bottom:12px;">' + esc(a.sub) + '</div>' +
          excHtml +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;margin-top:12px;">' +
          '<span style="color:rgba(255,255,255,0.5);font-size:11px;">' + esc(a.auth) + '</span>' +
          '<span style="color:rgba(255,255,255,0.35);font-size:11px;">' + esc(a.rt) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ─── RENDER SVG US MAP ──────────────────────
  function renderStateMap() {
    var container = document.getElementById('stride-map-container');
    if (!container) return;

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 800 500');
    svg.setAttribute('style', 'width:100%;');

    var tooltip = document.createElement('div');
    tooltip.id = 'stride-map-tooltip';
    tooltip.style.cssText = 'display:none;position:absolute;top:10px;right:10px;background:' + navy + ';border:1px solid rgba(201,168,76,0.3);border-radius:14px;padding:14px 20px;backdrop-filter:blur(16px);z-index:10;pointer-events:none;';

    var keys = Object.keys(ST);
    for (var i = 0; i < keys.length; i++) {
      (function(code) {
        var s = ST[code];
        var g = document.createElementNS(svgNS, 'g');
        g.setAttribute('style', 'cursor:pointer;');
        g.setAttribute('data-state', code);

        var circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', s.x);
        circle.setAttribute('cy', s.y);
        circle.setAttribute('r', '12');
        circle.setAttribute('fill', 'rgba(201,168,76,0.25)');
        circle.setAttribute('stroke', gold);
        circle.setAttribute('stroke-width', '0.5');
        circle.setAttribute('style', 'transition:all 0.3s cubic-bezier(0.16,1,0.3,1);');

        var outerRing = document.createElementNS(svgNS, 'circle');
        outerRing.setAttribute('cx', s.x);
        outerRing.setAttribute('cy', s.y);
        outerRing.setAttribute('r', '24');
        outerRing.setAttribute('fill', 'none');
        outerRing.setAttribute('stroke', 'rgba(201,168,76,0.3)');
        outerRing.setAttribute('stroke-width', '1');
        outerRing.setAttribute('style', 'opacity:0;transition:opacity 0.3s;');

        var text = document.createElementNS(svgNS, 'text');
        text.setAttribute('x', s.x);
        text.setAttribute('y', s.y + 1);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('fill', cream);
        text.setAttribute('font-size', '7.5');
        text.setAttribute('font-weight', '700');
        text.setAttribute('font-family', 'sans-serif');
        text.setAttribute('style', 'transition:all 0.3s;pointer-events:none;');
        text.textContent = code;

        g.appendChild(circle);
        g.appendChild(outerRing);
        g.appendChild(text);

        g.addEventListener('mouseenter', function() {
          circle.setAttribute('r', '18');
          circle.setAttribute('fill', 'rgba(201,168,76,0.9)');
          circle.setAttribute('stroke-width', '2');
          outerRing.setAttribute('style', 'opacity:1;transition:opacity 0.3s;');
          text.setAttribute('fill', midnight);
          text.setAttribute('font-size', '9');

          tooltip.style.display = 'block';
          tooltip.innerHTML =
            '<div style="color:' + gold + ';font-size:15px;font-weight:700;">' + esc(s.n) + '</div>' +
            '<div style="color:' + stone + ';font-size:12px;margin-top:3px;">' + s.r + ' upcoming races</div>' +
            '<div style="color:rgba(201,168,76,0.6);font-size:11px;margin-top:4px;">Click to explore \u2192</div>';
        });

        g.addEventListener('mouseleave', function() {
          circle.setAttribute('r', '12');
          circle.setAttribute('fill', 'rgba(201,168,76,0.25)');
          circle.setAttribute('stroke-width', '0.5');
          outerRing.setAttribute('style', 'opacity:0;transition:opacity 0.3s;');
          text.setAttribute('fill', cream);
          text.setAttribute('font-size', '7.5');
          tooltip.style.display = 'none';
        });

        g.addEventListener('click', function() {
          navigate('state', code);
        });

        svg.appendChild(g);
      })(keys[i]);
    }

  // ─── RENDER SEARCH ──────────────────────────
  function renderSearch() {
    var input = document.getElementById('stride-search-input');
    if (!input) return;

    var wrapper = input.parentElement;
    var clearBtn = document.getElementById('stride-search-clear');
    var dropdown = document.getElementById('stride-search-dropdown');

    if (!clearBtn) {
      clearBtn = document.createElement('span');
      clearBtn.id = 'stride-search-clear';
      clearBtn.style.cssText = 'cursor:pointer;color:' + slate + ';font-size:14px;display:none;padding:0 4px;';
      clearBtn.textContent = '\u2715';
      wrapper.appendChild(clearBtn);
    }

    if (!dropdown) {
      dropdown = document.createElement('div');
      dropdown.id = 'stride-search-dropdown';
      dropdown.style.cssText = 'display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:' + navy + ';border:1px solid rgba(201,168,76,0.3);border-top:none;border-radius:0 0 16px 16px;backdrop-filter:blur(20px);max-height:380px;overflow-y:auto;';
      wrapper.parentElement.style.position = 'relative';
      wrapper.parentElement.appendChild(dropdown);
    }

    function doSearch() {
      var q = input.value;
      var ql = q.toLowerCase();

      // Show/hide clear button
      if (clearBtn) {
        clearBtn.style.display = q ? 'inline' : 'none';
      }

      if (q.length < 2) {
        dropdown.style.display = 'none';
        wrapper.style.borderRadius = '16px';
        return;
      }

      // Filter states
      var sts = [];
      var sKeys = Object.keys(ST);
      for (var i = 0; i < sKeys.length; i++) {
        var code = sKeys[i];
        var st = ST[code];
        if (st.n.toLowerCase().indexOf(ql) !== -1 || code.toLowerCase() === ql) {
          sts.push({code: code, data: st});
          if (sts.length >= 3) break;
        }
      }

      // Filter races
      var rcs = [];
      for (var j = 0; j < ALL_R.length; j++) {
        var r = ALL_R[j];
        if (r.name.toLowerCase().indexOf(ql) !== -1 ||
            r.city.toLowerCase().indexOf(ql) !== -1 ||
            r.type.toLowerCase().indexOf(ql) !== -1) {
          rcs.push(r);
          if (rcs.length >= 5) break;
        }
      }

      if (sts.length === 0 && rcs.length === 0) {
        dropdown.style.display = 'none';
        wrapper.style.borderRadius = '16px';
        return;
      }

      dropdown.style.display = 'block';
      wrapper.style.borderRadius = '16px 16px 0 0';

      var html = '';

      if (sts.length > 0) {
        html += '<div style="padding:12px 20px 4px;"><div style="color:' + gold + ';font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;">States</div></div>';
        for (var si = 0; si < sts.length; si++) {
          html += '<div class="stride-search-item" data-search-state="' + sts[si].code + '" style="padding:10px 20px;cursor:pointer;display:flex;justify-content:space-between;transition:background 0.15s;">' +
            '<span style="color:' + cream + ';font-size:14px;">\uD83D\uDCCD ' + esc(sts[si].data.n) + '</span>' +
            '<span style="color:' + slate + ';font-size:12px;">' + sts[si].data.r + ' races</span>' +
          '</div>';
        }
      }

      if (rcs.length > 0) {
        html += '<div style="padding:12px 20px 4px;' + (sts.length ? 'border-top:1px solid rgba(255,255,255,0.04);' : '') + '"><div style="color:' + gold + ';font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;">Races</div></div>';
        for (var ri = 0; ri < rcs.length; ri++) {
          html += '<div class="stride-search-item" data-search-race-state="' + (rcs[ri].stateCode || '') + '" style="padding:10px 20px;cursor:pointer;transition:background 0.15s;">' +
            '<div style="color:' + cream + ';font-size:14px;">' + esc(rcs[ri].name) + '</div>' +
            '<div style="color:' + slate + ';font-size:12px;margin-top:2px;">' + esc(rcs[ri].type) + ' \u00B7 ' + esc(rcs[ri].date) + ' \u00B7 ' + esc(rcs[ri].state) + '</div>' +
          '</div>';
        }
      }

      dropdown.innerHTML = html;

      // Event delegation for dropdown items
      var items = dropdown.querySelectorAll('.stride-search-item');
      for (var ii = 0; ii < items.length; ii++) {
        items[ii].addEventListener('mouseenter', function() { this.style.background = 'rgba(201,168,76,0.08)'; });
        items[ii].addEventListener('mouseleave', function() { this.style.background = 'transparent'; });
        items[ii].addEventListener('click', function() {
          var sc = this.getAttribute('data-search-state');
          var rsc = this.getAttribute('data-search-race-state');
          if (sc) {
            navigate('state', sc);
          } else if (rsc) {
            navigate('state', rsc);
          }
          input.value = '';
          dropdown.style.display = 'none';
          wrapper.style.borderRadius = '16px';
          if (clearBtn) clearBtn.style.display = 'none';
        });
      }
    }

    input.addEventListener('input', doSearch);

    input.addEventListener('focus', function() {
      searchFocused = true;
      wrapper.style.borderColor = 'rgba(201,168,76,0.5)';
      doSearch();
    });

    input.addEventListener('blur', function() {
      searchFocused = false;
      setTimeout(function() {
        dropdown.style.display = 'none';
        wrapper.style.borderRadius = '16px';
        wrapper.style.borderColor = 'rgba(255,255,255,0.08)';
      }, 200);
    });

    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        input.value = '';
        clearBtn.style.display = 'none';
        dropdown.style.display = 'none';
        wrapper.style.borderRadius = '16px';
        input.focus();
      });
    }
  }

  // ─── HERO BACKGROUND ANIMATION ──────────────
  function startHeroAnimation() {
    var heroEl = document.getElementById('stride-hero');
    if (!heroEl) return;

    heroEl.style.background = heros[heroIndex];
    heroEl.style.transition = 'background 2s ease';

    if (heroInterval) clearInterval(heroInterval);
    heroInterval = setInterval(function() {
      heroIndex = (heroIndex + 1) % 3;
      heroEl.style.background = heros[heroIndex];
    }, 6000);
  }

  function renderFilteredRaces(races, filter) {
    var filtered = [];
    for (var i = 0; i < races.length; i++) {
      if (filter === 'All' || races[i].type === filter) {
        filtered.push(races[i]);
      }
    }

    if (filtered.length === 0) return '';

    var html = '';
    for (var j = 0; j < filtered.length; j++) {
      html += renderRaceCard(filtered[j]);
    }
    return html;
  }

  function updateTypeFilterUI() {
    var btns = document.querySelectorAll('.stride-type-btn');
    for (var i = 0; i < btns.length; i++) {
      var t = btns[i].getAttribute('data-type');
      var isActive = (t === typeFilter);
      btns[i].style.background = isActive ? gold : charcoal;
      btns[i].style.color = isActive ? midnight : slate;
      btns[i].style.borderColor = isActive ? gold : 'rgba(255,255,255,0.06)';
    }
  }

  function updateRaceGrid() {
    var grid = document.getElementById('stride-state-races');
    var empty = document.getElementById('stride-state-empty');
    var emptyText = document.getElementById('stride-state-empty-text');
    if (!grid) return;

    var html = renderFilteredRaces(stateRaces, typeFilter);
    grid.innerHTML = html;

      grid.style.display = 'none';
      if (empty) empty.style.display = 'block';
      if (emptyText) emptyText.textContent = 'No ' + typeFilter + ' races found.';
    } else {
      grid.style.display = '';
      if (empty) empty.style.display = 'none';
    }

    // Re-apply hover effects
    setupCardHovers(grid);
  }

    html += '</div>';
    container.innerHTML = html;

    // Back link handler
    var backLink = document.getElementById('stride-article-back');
    if (backLink) {
      backLink.addEventListener('click', function() {

  // ─── EDITORIAL PAGE ─────────────────────────
  function renderEditorialPage() {
    var container = document.getElementById('stride-editorial-content');
    if (!container) return;

    var html = '<div style="padding:100px 24px 60px;max-width:1200px;margin:0 auto;">';

    // Header
    html += '<div style="margin-bottom:48px;">' +
      '<div style="color:' + gold + ';font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;">The Journal</div>' +
      '<h1 style="font-family:Georgia,serif;font-size:44px;color:' + cream + ';margin:0 0 8px;">Stories & Guides</h1>' +
      '<p style="color:' + stone + ';font-size:15px;margin:0;">Race recaps, destination guides, and inspiration.</p>' +
    '</div>';

    // Featured articles (big)
    var featured = [];
    var regular = [];
    for (var i = 0; i < EDIT.length; i++) {
      if (EDIT[i].feat) {
        featured.push(EDIT[i]);
      } else {
        regular.push(EDIT[i]);
      }
    }

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;">';
    for (var fi = 0; fi < featured.length; fi++) {
      html += '<div>' + renderEditCard(featured[fi], true) + '</div>';
    }
    html += '</div>';

    // Regular articles
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;">';
    for (var ri = 0; ri < regular.length; ri++) {
      html += '<div>' + renderEditCard(regular[ri], false) + '</div>';
    }
    html += '</div>';

    html += '</div>';
    container.innerHTML = html;

    // Click handlers
    var editCards = container.querySelectorAll('.stride-edit-card');
    for (var ci = 0; ci < editCards.length; ci++) {
      editCards[ci].addEventListener('click', function() {
        var artId = parseInt(this.getAttribute('data-article-id'));
        for (var j = 0; j < EDIT.length; j++) {
          if (EDIT[j].id === artId) {
            navigate('article', EDIT[j]);
            break;
          }
        }
      });
    }

    setupCardHovers(container);
  }

  // ─── SUBMIT PAGE ────────────────────────────
  function renderSubmitPage() {
    var container = document.getElementById('stride-submit-content');
    if (!container) return;

    submitTier = 'featured';

    var tiers = [
      {id: "free", nm: "Basic Listing", pr: "Free", fs: ["Race name & details","Calendar placement","Map pin","Registration link"]},
      {id: "featured", nm: "Featured Listing", pr: "$99/race", hl: 1, fs: ["Everything in Basic","\u2605 Featured badge & top placement","Premium map pin","Editorial roundup eligibility","Social media feature","'Where to Stay' pairing"]}
    ];

    var html = '<div style="padding:100px 24px 60px;max-width:900px;margin:0 auto;">';

    // Header
    html += '<div style="text-align:center;margin-bottom:60px;">' +
      '<div style="color:' + gold + ';font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;">For Race Directors</div>' +
      '<h1 style="font-family:Georgia,serif;font-size:44px;color:' + cream + ';margin:0 0 12px;">List Your Race</h1>' +

    // Tier cards
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:48px;">';
    for (var ti = 0; ti < tiers.length; ti++) {
      var t = tiers[ti];
      var isSelected = (submitTier === t.id);
      var bg = t.hl ? 'linear-gradient(135deg,rgba(201,168,76,0.1),' + navy + ')' : navy;
      var border = isSelected ? '2px solid ' + gold : '1px solid rgba(255,255,255,0.06)';

      html += '<div class="stride-tier-card" data-tier="' + t.id + '" style="background:' + bg + ';border:' + border + ';border-radius:20px;padding:32px;cursor:pointer;transition:all 0.3s;">';
      if (t.hl) {
        html += '<div style="color:' + gold + ';font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;">Most Popular</div>';
      }
      html += '<div style="color:' + cream + ';font-size:22px;font-weight:700;margin-bottom:4px;">' + esc(t.nm) + '</div>';
      html += '<div style="color:' + gold + ';font-size:28px;font-weight:700;font-family:Georgia,serif;margin-bottom:20px;">' + esc(t.pr) + '</div>';
      for (var fi = 0; fi < t.fs.length; fi++) {
        html += '<div style="color:' + stone + ';font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;"><span style="color:' + green + ';">\u2713</span>' + esc(t.fs[fi]) + '</div>';
      }
      html += '</div>';
    }
    html += '</div>';

    // Form
    var fields = ["Race Name","Race Type","Date","Location (City, State)","Website URL","Contact Email"];
    html += '<div style="background:' + navy + ';border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:40px;">';
    html += '<h3 style="color:' + cream + ';font-size:20px;font-family:Georgia,serif;margin-top:0;margin-bottom:24px;">Submit Your Event</h3>';

    for (var fi2 = 0; fi2 < fields.length; fi2++) {
      html += '<div style="margin-bottom:20px;">' +
        '<label style="color:' + stone + ';font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:8px;">' + esc(fields[fi2]) + '</label>' +
        '<input class="stride-submit-input" placeholder="' + esc(fields[fi2]) + '" style="width:100%;background:' + charcoal + ';border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 16px;color:' + cream + ';font-size:15px;outline:none;box-sizing:border-box;transition:border 0.2s;font-family:inherit;" />' +
      '</div>';
    }

    html += '<button id="stride-submit-btn" style="width:100%;background:linear-gradient(135deg,' + gold + ',' + goldDk + ');color:' + midnight + ';border:none;border-radius:12px;padding:16px 32px;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;">Submit Featured Listing \u2192</button>';
    html += '</div>';
    html += '</div>';

    container.innerHTML = html;

    // Tier card selection
    var tierCards = container.querySelectorAll('.stride-tier-card');
    for (var tc = 0; tc < tierCards.length; tc++) {
      tierCards[tc].addEventListener('mouseenter', function() {
        this.style.transform = 'translateY(-3px)';
      });
      tierCards[tc].addEventListener('mouseleave', function() {
        this.style.transform = 'translateY(0)';
      });
      tierCards[tc].addEventListener('click', function() {
        submitTier = this.getAttribute('data-tier');
        // Update borders
        var all = container.querySelectorAll('.stride-tier-card');
        for (var k = 0; k < all.length; k++) {
          var isSel = (all[k].getAttribute('data-tier') === submitTier);
          all[k].style.border = isSel ? '2px solid ' + gold : '1px solid rgba(255,255,255,0.06)';
        }
        // Update button text
        var btn = document.getElementById('stride-submit-btn');
        if (btn) {
          btn.textContent = 'Submit ' + (submitTier === 'featured' ? 'Featured' : 'Basic') + ' Listing \u2192';
        }
      });
    }

    // Input focus/blur
    var inputs = container.querySelectorAll('.stride-submit-input');
    for (var ii = 0; ii < inputs.length; ii++) {
      inputs[ii].addEventListener('focus', function() {
        this.style.borderColor = 'rgba(201,168,76,0.5)';
      });
      inputs[ii].addEventListener('blur', function() {
        this.style.borderColor = 'rgba(255,255,255,0.06)';
      });
    }
  }

  // ─── PARTNER PAGE ───────────────────────────
  function renderPartnerPage() {
    var container = document.getElementById('stride-partner-content');
    if (!container) return;

    var html = '<div style="padding:100px 24px 60px;max-width:1100px;margin:0 auto;">';

    // Header
    html += '<div style="text-align:center;margin-bottom:60px;">' +
      '<div style="color:' + gold + ';font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;">For Brands & Destinations</div>' +
      '<h1 style="font-family:Georgia,serif;font-size:44px;color:' + cream + ';margin:0 0 12px;">Partner With STRIDE</h1>' +
      '<p style="color:' + stone + ';font-size:15px;margin:0 auto;max-width:600px;line-height:1.7;">Reach an engaged audience of affluent, active, travel-ready endurance athletes.</p>' +

        '<div style="color:' + stone + ';font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-top:4px;">' + stats[si][1] + '</div>' +

    }

    html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:60px;">';

      }
      html += '<div style="width:12px;height:12px;border-radius:50%;background:' + t.color + ';margin-bottom:16px;"></div>';
      html += '<div style="color:' + cream + ';font-size:20px;font-weight:700;margin-bottom:4px;">' + esc(t.name) + '</div>';

        html += '<div style="color:' + stone + ';font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;"><span style="color:' + t.color + ';">\u2713</span>' + esc(t.feats[fi]) + '</div>';

      html += '<button style="width:100%;margin-top:20px;background:' + btnBg + ';color:' + btnCol + ';border:' + btnBorder + ';border-radius:12px;padding:12px 24px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;text-transform:uppercase;">Get Started</button>';

    html += '<div style="background:linear-gradient(135deg,rgba(201,168,76,0.1),' + navy + ');border:1px solid rgba(201,168,76,0.2);border-radius:24px;padding:48px;text-align:center;">' +
      '<h2 style="font-family:Georgia,serif;color:' + cream + ';font-size:28px;margin:0 0 12px;">Ready to reach race-day audiences?</h2>' +

      '<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">' +

        '<button style="background:transparent;color:' + gold + ';border:1px solid rgba(201,168,76,0.4);border-radius:12px;padding:14px 32px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;text-transform:uppercase;">Schedule a Call</button>' +
      '</div>' +
    '</div>';

    html += '</div>';

    var tierEls = container.querySelectorAll('.stride-partner-tier');
    for (var th = 0; th < tierEls.length; th++) {
      tierEls[th].addEventListener('mouseenter', function() {

  // ─── NAV LINK SETUP ─────────────────────────
  function setupNav() {
    // Nav links with data-page
    var navLinks = document.querySelectorAll('[data-page]');
    for (var i = 0; i < navLinks.length; i++) {
      navLinks[i].addEventListener('click', function(e) {
        e.preventDefault();
        var page = this.getAttribute('data-page');
        navigate(page);
      });
    }

    // Brand logo click → home
    var brandLogo = document.getElementById('stride-brand-logo');
    if (brandLogo) {
      brandLogo.addEventListener('click', function(e) {
        e.preventDefault();
        navigate('home');
      });
    }

    // Nav link hover effects
    for (var j = 0; j < navLinks.length; j++) {
      navLinks[j].addEventListener('mouseenter', function() {
        this.style.color = gold;
      });
      navLinks[j].addEventListener('mouseleave', function() {
        var page = this.getAttribute('data-page');
        if (page !== currentPage) {
          this.style.color = slate;
        }
      });
    }

    // "View All" link to editorial
    var viewAllBtn = document.getElementById('stride-view-all-editorial');
    if (viewAllBtn) {
      viewAllBtn.addEventListener('click', function(e) {
        e.preventDefault();
        navigate('editorial');
      });
    }
  }

  // ─── INIT ───────────────────────────────────
  console.log('[STRIDE] Initializing with ' + ALL_R.length + ' races across ' + stateKeys.length + ' states');

  setupNav();
  navigate('home');
});
</script>
