<!-- ============================================
     NC ENDURANCE GUIDE — CMS DATA BRIDGE
     ============================================

     HOW TO SET UP IN WEBFLOW:
     ─────────────────────────

     STEP 1: Make sure your CMS Collection "NC Races" has these fields:
       - Race Name        (Plain Text)
       - Race Date        (Date — format: YYYY-MM-DD)
       - City             (Plain Text)
       - Region           (Option: Northwest, Southwest, Central, Northeast, Southeast)
       - Distance         (Option: 5K, 10K, Half Marathon, Marathon, Ultra, Triathlon)
       - Description      (Plain Text)
       - Race Logo        (Image — optional)
       - Race URL         (URL)
       - Featured         (Switch — yes/no)
       - Latitude         (Plain Text — e.g. 35.7796)
       - Longitude        (Plain Text — e.g. -78.6382)
       - Slug             (Auto-generated by Webflow)

     STEP 2: On your race directory page, add a Collection List:
       - Drag a "Collection List Wrapper" onto the page
         (Add Elements panel > CMS > Collection List)
       - Bind it to the "NC Races" collection
       - Set the limit to 100 (or however many races you want)
       - Set Sort to "Race Date" ascending
       - Give the Collection List Wrapper the class: nceg-cms-data
         (This hides it — the CSS is already in head code)

     STEP 3: Inside the Collection Item, add an Embed element:
       - Click into the Collection Item
       - Add an "Embed" component (Add Elements > Components > Embed)
       - Paste the template below into the Embed
       - For EACH data attribute, click the purple "Add Field" button
         and select the matching CMS field

     STEP 4: Replace each placeholder below with a CMS field.
       Click inside the quotes after data-name=", then click
       "Add Field" and choose "Race Name", etc.

     ============================================ -->

<!-- PASTE THIS INSIDE THE EMBED ELEMENT (inside your Collection Item): -->

<div class="nceg-cms-race"
  data-name="RACE_NAME"
  data-date="RACE_DATE"
  data-city="CITY"
  data-region="REGION"
  data-distance="DISTANCE"
  data-description="DESCRIPTION"
  data-logo="RACE_LOGO"
  data-url="RACE_URL"
  data-featured="FEATURED"
  data-lat="LATITUDE"
  data-lng="LONGITUDE">
</div>

<!--
     FIELD MAPPING — Replace each ALL-CAPS placeholder:
     ───────────────────────────────────────────────────
     RACE_NAME    → Click "Add Field" → select "Race Name"
     RACE_DATE    → Click "Add Field" → select "Race Date"
                    (Use Webflow date format: YYYY-MM-DD)
     CITY         → Click "Add Field" → select "City"
     REGION       → Click "Add Field" → select "Region"
     DISTANCE     → Click "Add Field" → select "Distance"
     DESCRIPTION  → Click "Add Field" → select "Description"
     RACE_LOGO    → Click "Add Field" → select "Race Logo"
                    (This outputs the image URL)
     RACE_URL     → Click "Add Field" → select "Race URL"
     FEATURED     → Click "Add Field" → select "Featured"
                    (Outputs "true" or "false")
     LATITUDE     → Click "Add Field" → select "Latitude"
     LONGITUDE    → Click "Add Field" → select "Longitude"

     IMPORTANT DATE FORMAT:
     In Webflow, when you insert the Date field, click the
     field settings gear icon and set the format to:
       YYYY-MM-DD   (e.g., 2026-09-12)
     This is critical for the filters to work correctly.
-->
