  // ─── READ RACE DATA FROM WEBFLOW CMS ──────
  // The hidden Collection List outputs <div class="nceg-cms-race">
  // elements with data-* attributes for each race.
  // If no CMS data found, falls back to sample data for testing.

  function loadRacesFromCMS() {
    var items = document.querySelectorAll('.nceg-cms-race');
    if (!items.length) return null;

    var races = [];
    items.forEach(function (el, i) {
      var dateRaw = (el.getAttribute('data-date') || '').trim();
      // Handle Webflow date formats: "2026-09-12" or "September 12, 2026" etc.
      var dateISO = normalizeDate(dateRaw);

      var featuredRaw = (el.getAttribute('data-featured') || '').toLowerCase().trim();
      var isFeatured = featuredRaw === 'true' || featuredRaw === 'yes' || featuredRaw === 'on';

      var sponsoredRaw = (el.getAttribute('data-sponsored') || '').toLowerCase().trim();
      var isSponsored = sponsoredRaw === 'true' || sponsoredRaw === 'yes' || sponsoredRaw === 'on';

      races.push({
        id: 'cms-' + i,
        name:        (el.getAttribute('data-name') || '').trim(),
        date:        dateISO,
        city:        (el.getAttribute('data-city') || '').trim(),
        region:      (el.getAttribute('data-region') || '').trim(),
        distance:    (el.getAttribute('data-distance') || '').trim(),
        description: (el.getAttribute('data-description') || '').trim(),
        logo:        (el.getAttribute('data-logo') || '').trim(),
        url:         (el.getAttribute('data-url') || '#').trim(),
        featured:    isFeatured,
        sponsored:   isSponsored,
        lat:         parseFloat(el.getAttribute('data-lat')) || 0,
        lng:         parseFloat(el.getAttribute('data-lng')) || 0
      });
    });

    return races;
  }

  // Normalize various date formats to YYYY-MM-DD
  function normalizeDate(str) {
    if (!str) return '';
    // Already in YYYY-MM-DD format
    if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
      return str.substring(0, 10);
    }
    // Try parsing as a date string (e.g. "September 12, 2026")
    var d = new Date(str);
    if (!isNaN(d.getTime())) {
      var y = d.getFullYear();
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      var day = ('0' + d.getDate()).slice(-2);
      return y + '-' + m + '-' + day;
    }
    return str;
  }

  // ─── LOAD DATA: CMS first, sample as fallback ───
  var cmsData = loadRacesFromCMS();

  if (cmsData && cmsData.length) {

    var hasValidCMS = cmsData.some(function (r) { return r.name; });

  // ─── ICONS ─────────────────────────────────
  var ico = {
    pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>',

  };

  // ─── HELPERS ────────────────────────────────
  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  function parseD(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function fmtShort(s) {
    if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return s || 'TBD';
    var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var d = parseD(s);
    return m[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

  function fmtLong(s) {
    if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return s || 'TBD';
    var m = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var d = parseD(s);
    return m[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

  function inRange(dateStr, key) {
    if (!key) return true;
    var now = new Date(), rd = parseD(dateStr), end;
    switch (key) {
      case 'this-month':
        return rd.getMonth() === now.getMonth() && rd.getFullYear() === now.getFullYear();
      case 'next-month':
        end = new Date(now.getFullYear(), now.getMonth() + 2, 0);
        var s = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        return rd >= s && rd <= end;
      case '3-months':
        end = new Date(now.getFullYear(), now.getMonth() + 3, now.getDate());
        return rd >= now && rd <= end;
      case '6-months':
        end = new Date(now.getFullYear(), now.getMonth() + 6, now.getDate());
        return rd >= now && rd <= end;
      case 'this-year':
        return rd.getFullYear() === now.getFullYear();
      default: return true;
    }
  }

  // ─── POPULATE CITIES ───────────────────────
  function populateCities() {
    var c = [];
    races.forEach(function (r) { if (r.city && c.indexOf(r.city) === -1) c.push(r.city); });
    c.sort();
    c.forEach(function (city) {
      var o = document.createElement('option');
      o.value = city; o.textContent = city;
      filterCity.appendChild(o);
    });
  }

  // ─── FEATURED RACE (Auto-Rotating Weekly) ──
  function isValidRace(r) {
    return r && r.name && r.date && /^\d{4}-\d{2}-\d{2}/.test(r.date);
  }

  function pickFeatured() {
    // 1. If any race is manually flagged as featured AND has valid data, use it
    var manual = races.filter(function (r) { return r.featured && isValidRace(r); });
    if (manual.length) return manual[0];

    // 2. Otherwise, auto-rotate weekly among upcoming valid races
    var now = new Date();
    var upcoming = races.filter(function (r) {
      return isValidRace(r) && parseD(r.date) >= now;
    }).sort(function (a, b) {
      return parseD(a.date) - parseD(b.date);
    });

    if (!upcoming.length) {
      // 3. If no upcoming, try any valid race
      var any = races.filter(isValidRace);
      if (!any.length) return null;
      return any[0];
    }

    // Week number since epoch — changes every Monday
    var weekNum = Math.floor((now.getTime() / 1000 / 60 / 60 / 24 + 4) / 7);
    var idx = weekNum % upcoming.length;
    return upcoming[idx];
  }

  function renderFeatured() {
    var f = pickFeatured();
    if (!f) { document.getElementById('nceg-featured').style.display = 'none'; return; }
    // Mark it so it's excluded from the grid
    f.featured = true;

    var logo = f.logo
      ? '<img src="' + esc(f.logo) + '" alt="' + esc(f.name) + ' logo" class="nceg-featured-logo">'
      : '<div class="nceg-featured-logo-ph">' + ico.clk + '</div>';

    featuredEl.innerHTML =
      '<a href="' + esc(f.url) + '" class="nceg-featured-link">' +
        logo +
        '<div class="nceg-featured-details">' +
          '<div class="nceg-featured-badge">Featured Race</div>' +
          '<p class="nceg-featured-date">' + ico.cal + ' ' + fmtLong(f.date) + '</p>' +
          '<h3 class="nceg-featured-name">' + esc(f.name) + '</h3>' +
          '<div class="nceg-featured-meta">' +
            '<span class="nceg-meta-item">' + ico.pin + ' ' + esc(f.city) + ', NC</span>' +
            '<span class="nceg-meta-item">' + ico.map + ' ' + esc(f.region) + '</span>' +
            '<span class="nceg-meta-item">' + ico.clk + ' ' + esc(f.distance) + '</span>' +
          '</div>' +
          '<p class="nceg-featured-desc">' + esc(f.description) + '</p>' +
          '<span class="nceg-btn nceg-btn-primary nceg-featured-cta">View Race Details</span>' +
        '</div>' +
      '</a>';
  }

  // ─── RACE CARD ─────────────────────────────
  function cardHTML(r) {
    var logo = r.logo
      ? '<img src="' + esc(r.logo) + '" alt="' + esc(r.name) + '" class="nceg-card-logo">'
      : '<div class="nceg-card-logo-ph">' + ico.run + '</div>';

    var sponsorBadge = r.sponsored
      ? '<span class="nceg-sponsor-badge">Sponsored</span>'
      : '';

    var cardClass = 'nceg-card' + (r.sponsored ? ' nceg-card-sponsored' : '');

    return (
      '<a href="' + esc(r.url) + '" class="' + cardClass + '" data-id="' + r.id + '">' +
        sponsorBadge +
        '<div class="nceg-card-body">' +
          '<div class="nceg-card-header">' +
            '<span class="nceg-card-date">' + fmtShort(r.date) + '</span>' +
            logo +
          '</div>' +
          '<h3 class="nceg-card-name">' + esc(r.name) + '</h3>' +
          '<div class="nceg-card-meta">' +
            '<span class="nceg-card-meta-item">' + ico.pin + ' ' + esc(r.city) + ', NC</span>' +
            '<span class="nceg-card-meta-item">' + ico.map + ' ' + esc(r.region) + '</span>' +
          '</div>' +
          '<p class="nceg-card-desc">' + esc(r.description) + '</p>' +
        '</div>' +
        '<div class="nceg-card-divider"></div>' +
        '<div class="nceg-card-footer">' +
          '<span class="nceg-card-distance">' + esc(r.distance) + '</span>' +
          '<span class="nceg-card-link">View Race ' + ico.arr + '</span>' +
        '</div>' +
      '</a>'
    );
  }

  // ─── FILTER + RENDER ───────────────────────
  function applyFilters() {
    var dv = filterDate.value,
        rv = filterRegion.value,
        cv = filterCity.value,
        xv = filterDistance.value,
        sv = filterSort.value;

    var out = races.filter(function (r) {
      if (r.featured) return false;
      if (!r.name) return false; // skip races with no name
      if (!inRange(r.date, dv)) return false;
      if (rv && r.region !== rv) return false;
      if (cv && r.city !== cv) return false;
      if (xv && r.distance !== xv) return false;
      return true;
    });

    out.sort(function (a, b) {
      // Sponsored races always appear first
      if (a.sponsored && !b.sponsored) return -1;
      if (!a.sponsored && b.sponsored) return 1;
      if (sv === 'date-desc') return parseD(b.date) - parseD(a.date);
      if (sv === 'name-asc') return a.name.localeCompare(b.name);
      return parseD(a.date) - parseD(b.date);
    });

    if (!out.length) {
      grid.style.display = 'none';
      emptyEl.style.display = 'block';
      countEl.textContent = '';
    } else {
      grid.style.display = '';
      emptyEl.style.display = 'none';
      countEl.textContent = out.length + ' race' + (out.length !== 1 ? 's' : '') + ' found';
      var h = '';
      out.forEach(function (r) { h += cardHTML(r); });
      grid.innerHTML = h;
    }
  }

  function clearFilters() {
    filterDate.value = '';
    filterRegion.value = '';
    filterCity.value = '';
    filterDistance.value = '';
    filterSort.value = 'date-asc';
    applyFilters();
  }

  // ─── EVENTS ────────────────────────────────
  filterDate.addEventListener('change', applyFilters);
  filterRegion.addEventListener('change', applyFilters);
  filterCity.addEventListener('change', applyFilters);
  filterDistance.addEventListener('change', applyFilters);
  filterSort.addEventListener('change', applyFilters);
  clearBtn.addEventListener('click', clearFilters);
  emptyClearBtn.addEventListener('click', clearFilters);

  var filterToggle = document.getElementById('nceg-filter-toggle');
  var filtersInner = document.getElementById('nceg-filters-inner');
  var filterActiveCount = document.getElementById('nceg-filter-active-count');

  if (filterToggle && filtersInner) {
    filterToggle.addEventListener('click', function () {
      var isOpen = filtersInner.classList.toggle('nceg-filters-open');
      filterToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }

  // Update active filter count badge
  function updateFilterCount() {
    var count = 0;
    if (filterDate.value) count++;
    if (filterRegion.value) count++;
    if (filterCity.value) count++;
    if (filterDistance.value) count++;
    if (filterActiveCount) {
      if (count > 0) {
        filterActiveCount.textContent = count;
        filterActiveCount.classList.add('nceg-has-filters');
      } else {
        filterActiveCount.textContent = '';
        filterActiveCount.classList.remove('nceg-has-filters');
      }
    }
  }

  filterDate.addEventListener('change', updateFilterCount);
  filterRegion.addEventListener('change', updateFilterCount);
  filterCity.addEventListener('change', updateFilterCount);
  filterDistance.addEventListener('change', updateFilterCount);

  // Smooth scroll
  document.querySelectorAll('a[href^="#nceg"]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var t = document.querySelector(this.getAttribute('href'));
      if (t) {
        e.preventDefault();
        var off = 130;
        var pos = t.getBoundingClientRect().top + window.pageYOffset - off;
        window.scrollTo({ top: pos, behavior: 'smooth' });
      }
    });
  });

  // Header shadow on scroll
  var hdr = document.getElementById('nceg-header');

    hdr.style.boxShadow = window.pageYOffset > 100

      : 'none';

  // ─── INTERACTIVE MAP ────────────────────────
  function initMap() {
    var mapEl = document.getElementById('nceg-leaflet-map');
    if (!mapEl || typeof L === 'undefined') return;

    var map = L.map('nceg-leaflet-map', {
      scrollWheelZoom: false,
      zoomControl: true
    }).setView([35.55, -79.4], 7);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 16
    }).addTo(map);

    function makeIcon(color) {
      return L.divIcon({
        className: 'nceg-map-marker',
        html: '<svg width="28" height="40" viewBox="0 0 28 40" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M14 0C6.268 0 0 6.268 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.268 21.732 0 14 0z" fill="' + color + '"/>' +
          '<circle cx="14" cy="14" r="6" fill="#fff" opacity="0.9"/>' +
          '<circle cx="14" cy="14" r="3" fill="' + color + '"/>' +
          '</svg>',
        iconSize: [28, 40],
        iconAnchor: [14, 40],
        popupAnchor: [0, -36]
      });
    }

    var navyIcon = makeIcon('#1B2A4A');
    var goldIcon = makeIcon('#C4A265');

    var markers = L.featureGroup();

    races.forEach(function (r) {
      if (!r.lat || !r.lng) return;

      var icon = r.featured ? goldIcon : navyIcon;

      var popupContent =
        '<div class="nceg-popup-inner">' +
          '<span class="nceg-popup-date">' + fmtShort(r.date) + '</span>' +
          '<div class="nceg-popup-name">' + esc(r.name) + '</div>' +
          '<div class="nceg-popup-meta">' + esc(r.city) + ', NC &middot; ' + esc(r.region) + '</div>' +
          '<span class="nceg-popup-distance">' + esc(r.distance) + '</span>' +
          '<a href="' + esc(r.url) + '" class="nceg-popup-link">View Race Details</a>' +
        '</div>';

      var marker = L.marker([r.lat, r.lng], { icon: icon })
        .bindPopup(popupContent, {
          className: 'nceg-map-popup',
          maxWidth: 280,
          minWidth: 220
        });

      markers.addLayer(marker);
    });

    markers.addTo(map);

    if (markers.getLayers().length > 0) {
      map.fitBounds(markers.getBounds().pad(0.15));
      // Don't zoom in past level 10 (prevents street-level zoom with 1-2 markers)
      if (map.getZoom() > 10) map.setZoom(10);
    }

    setTimeout(function () { map.invalidateSize(); }, 300);
  }

  // ─── NEWSLETTER FORM ───────────────────────
  var nlForm = document.getElementById('nceg-newsletter-form');
  if (nlForm) {
    nlForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var name  = document.getElementById('nceg-nl-name').value.trim();
      var email = document.getElementById('nceg-nl-email').value.trim();
      var region = document.getElementById('nceg-nl-region').value;

      if (!email) return;

      // Show success state
      var msgEl = document.getElementById('nceg-nl-message');
      nlForm.style.display = 'none';
      msgEl.style.display = 'block';
      msgEl.textContent = 'You\'re in! We\'ll send ' + region + ' race updates to ' + email;

      console.log('[NCEG] Newsletter signup:', { name: name, email: email, region: region });
      // To connect to Mailchimp/ConvertKit, replace this with your form action
      // or use their JS API to POST the data.
    });
  }

  // ─── INIT ──────────────────────────────────
  populateCities();
  renderFeatured();
  applyFilters();
  initMap();
})();
</script>
